<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oberon Rehearsal</title><style>
:root{--purple:#55207d;--pink:#a91f54;--gold:#ffd34e;--cream:#fff9eb;--green:#16865b;--ink:#26183d}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--purple),var(--pink));min-height:100vh}.top{height:20px;background:repeating-linear-gradient(90deg,#8e1539 0 25px,#c72858 25px 50px)}main{max-width:850px;margin:auto;padding:20px 12px 40px}header{text-align:center;color:white}h1{font-size:clamp(32px,7vw,54px);margin:10px 0 0}.sub{margin:4px 0 18px}.card{background:var(--cream);border:4px solid var(--gold);border-radius:24px;padding:18px;box-shadow:0 15px 35px #20092688}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}button{font:inherit;font-weight:800;border:0;border-radius:15px;padding:14px;cursor:pointer;min-height:52px}.tile{background:white;border:3px solid #eadbb8;font-size:18px}.tile b{display:block;font-size:31px}.primary{background:#703bd1;color:white}.secondary{background:white;color:#5a28a2;border:2px solid #6b35c6}.danger{background:white;color:#b22049;border:2px solid #b22049}.bar{height:12px;border-radius:8px;background:#332443;overflow:hidden}.bar div{height:100%;width:0;background:var(--gold)}.stage{background:radial-gradient(circle at top,#552b82,#171022);color:white;border-radius:20px;padding:18px;text-align:center;min-height:430px}.badge{display:inline-block;background:var(--gold);color:#321749;border-radius:999px;padding:6px 12px;font-weight:900}.bubble{background:white;color:var(--ink);border-radius:18px;margin:16px auto;padding:20px;min-height:115px;display:grid;place-items:center;font-size:clamp(21px,5vw,32px);max-width:700px}.mic{width:94px;height:94px;border-radius:50%;font-size:40px;background:white;color:#6534b7;border:8px solid #c8adf2}.mic.on{background:#ef3760;color:white;box-shadow:0 0 0 12px #ef376044}.status{min-height:54px;margin:12px;font-weight:800;font-size:18px}.feedback{background:white;color:var(--ink);border-radius:14px;padding:10px;margin:10px auto;max-width:680px}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.toprow{display:flex;gap:10px;align-items:center}.toprow h2{flex:1}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:white;padding:16px;border-radius:14px;text-align:center}.stat b{display:block;font-size:28px;color:#6534b7}.lines{background:white;border-radius:14px;max-height:350px;overflow:auto;padding:10px}.line{padding:9px;border-bottom:1px solid #eee}.good{color:var(--green)}.warn{color:#ac6500}dialog{border:0;border-radius:18px;max-width:560px;width:90%;padding:20px}dialog::backdrop{background:#150923bb}@media(max-width:560px){.grid{grid-template-columns:1fr}.card{padding:12px}}
</style></head><body><div class="top"></div><main><header><h1>🎭 Oberon Rehearsal</h1><p class="sub">Practise Oberon's lines from the supplied pages</p></header>
<section id="home" class="card"><div class="grid"><button class="tile" onclick="choose()"><b>▶️</b>Start rehearsing</button><button class="tile" onclick="startDifficult()"><b>🎯</b>Practise difficult lines</button><button class="tile" onclick="showProgress()"><b>🏆</b>View progress</button><button class="tile" onclick="showScript()"><b>📜</b>Review Oberon's lines</button></div><p style="text-align:center;color:#6b6477">No uploads or setup needed. Progress stays on this device.</p></section>
<section id="modes" class="card hidden"><div class="toprow"><button class="secondary" onclick="show('home')">← Home</button><h2>Choose a mode</h2></div><div class="grid"><button class="tile" onclick="begin('learning')"><b>🌱</b>Learning<br><small>See each line</small></button><button class="tile" onclick="begin('rehearsal')"><b>🎭</b>Rehearsal<br><small>Lines hidden</small></button><button class="tile" onclick="begin('performance')"><b>🌟</b>Performance<br><small>Feedback at the end</small></button><button class="tile" onclick="startDifficult()"><b>🎯</b>Difficult lines</button></div></section>
<section id="play" class="card hidden"><div class="toprow"><button class="secondary" onclick="stopAll();show('home')">✕ Exit</button><h2 id="title">Rehearsal</h2></div><div class="stage"><div class="bar"><div id="bar"></div></div><p><span class="badge" id="who">Ready</span></p><div class="bubble" id="bubble">Press Start when ready.</div><button class="mic" id="mic" onclick="listen()">🎙️</button><div id="status" class="status">The app will speak each cue.</div><div id="feedback" class="feedback hidden"></div><div class="controls"><button class="primary" id="start" onclick="next()">Start</button><button class="secondary" onclick="replay()">🔁 Replay cue</button><button class="secondary" id="hint" onclick="hint()">💡 Hint</button><button class="secondary" onclick="skip()">Skip →</button></div></div></section>
<section id="progress" class="card hidden"><div class="toprow"><button class="secondary" onclick="show('home')">← Home</button><h2>Progress</h2></div><div id="stats" class="stats"></div><h3>Lines to practise</h3><div id="hard" class="lines"></div><button class="danger" style="margin-top:14px" onclick="resetProgress()">Reset progress</button></section>
<section id="script" class="card hidden"><div class="toprow"><button class="secondary" onclick="show('home')">← Home</button><h2>Oberon's lines</h2></div><div id="allLines" class="lines"></div></section>
</main><dialog id="done"><h2>🎉 Rehearsal complete</h2><div id="doneText"></div><button class="primary" onclick="document.getElementById('done').close();showProgress()">See progress</button> <button class="secondary" onclick="document.getElementById('done').close();show('home')">Home</button></dialog>
<script>
'use strict';
const turns=[
["Titania enters and confronts Oberon.","Ill met by moonlight, proud Titania."],
["Titania calls Oberon jealous and prepares to leave.","Titania, let me have the little changeling boy To be my henchman."],
["Titania refuses to part with the child.","How long within this wood do you intend to stay?"],
["Titania says she will stay until Theseus' wedding day.","Ah! Theseus...your old friend."],
["Titania and the Fairies leave.","My gentle Puck, come hither!"],
["Puck comes eagerly to Oberon.","Fetch me that flower, the herb I showed thee once. The juice of it on sleeping eyelids laid Will make or man or woman madly dote Upon the next live creature that it sees! Fetch me this herb!"],
["Puck rushes away to fetch the flower.","I'll watch Titania while she is asleep And drop the liquor of it in her eyes. The next thing then she, waking, looks upon Be it on lion, bear, or wolf, or bull She shall pursue it with the soul of love!"],
["Oberon has watched Demetrius reject Helena.","Hmmm...."],
["Puck returns with the flower.","Welcome, wanderer!"],
["Puck gives Oberon the flower.","Take thou some of it, and seek through this grove. A sweet Athenian lady is in love With a disdainful youth: anoint his eyes But do it when the next thing he espies May be the lady."],
["Titania has fallen asleep and Oberon approaches with the flower.","What thou seest when thou dost wake Do it for thy true love take. Wake when something vile is near!"],
["Puck reports that Titania has fallen in love with a monster.","Ha! This falls out better than I could devise!"],
["Demetrius and Hermia enter.","Stand close: this is the Athenian!"],
["Oberon realises Puck enchanted the wrong man.","What hast thou done? Thou hast mistaken quite And laid the love-juice on some true love's sight."],
["Puck admits the mistake.","About the woods go swifter than the wind And Helena of Athens look thou find."],
["Oberon puts the flower juice on Demetrius' eyes.","Flower of this purple dye Sink in apple of his eye When his love he doth espy!"],
["Puck returns and warns that Helena and the mistaken youth are approaching.","Stand aside. The noise they make Will cause Demetrius to awake."],
["Oberon comes forward with Puck after the lovers collapse.","This is all your fault!"],
["Puck says that Oberon mistook the situation.","Yes yes yes! Now Puck - just sort it out! Use this herb. It is the antidote."],
["Oberon has obtained the changeling child and prepares to undo Titania's enchantment.","I have already asked of her the changeling child Which straight she gave me. So now I have the boy, I will undo This hateful imperfection of her eyes."],
["Titania wakes and describes her strange vision.","There lies your love."],
["Bottom wakes.","Puck, take off this head."]];
const ids=['home','modes','play','progress','script'];const el=x=>document.getElementById(x);let i=0,mode='rehearsal',rec=null,listening=false,hints=0,attempts=0,session=[],subset=null,lastCue='';
function show(x){ids.forEach(y=>el(y).classList.toggle('hidden',x!==y));scrollTo(0,0)}function choose(){show('modes')}
function begin(m,inds=null){mode=m;subset=inds;i=inds?inds[0]:0;session=[];el('title').textContent=inds?'Difficult lines':({learning:'Learning mode',rehearsal:'Rehearsal mode',performance:'Performance mode'}[m]);el('hint').classList.toggle('hidden',m==='performance');el('start').classList.remove('hidden');el('start').textContent='Start';el('who').textContent='Ready';el('bubble').textContent='Press Start when ready.';el('status').textContent='The app will speak each cue.';el('feedback').classList.add('hidden');paint();show('play')}
function next(){el('start').classList.add('hidden');if(subset&&!subset.includes(i)){let n=subset.find(x=>x>i);if(n==null)return finish();i=n}if(i>=turns.length)return finish();hints=0;attempts=0;el('feedback').classList.add('hidden');lastCue=turns[i][0];el('who').textContent='Cue';el('bubble').textContent=lastCue;el('status').textContent='Listen for your cue…';paint();speak(lastCue,()=>setTimeout(yourTurn,250))}
function yourTurn(){el('who').textContent='Your turn: OBERON';el('bubble').textContent=mode==='learning'?turns[i][1]:'Your line is hidden';el('status').textContent=supported()?'Get ready…':'Say the line aloud, then tap ✓ to self-check.';if(supported())setTimeout(listen,500);else fallback()}
function supported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
function listen(){if(!supported())return fallback();if(listening){try{rec.stop()}catch{}return}const R=window.SpeechRecognition||window.webkitSpeechRecognition;rec=new R();rec.lang='en-GB';rec.interimResults=true;rec.continuous=false;let heard='';rec.onstart=()=>{listening=true;el('mic').classList.add('on');el('status').textContent='Listening… say your line'};rec.onresult=e=>{heard=Array.from(e.results).map(r=>r[0].transcript).join(' ');el('status').textContent='I heard: “'+heard+'”'};rec.onerror=()=>{el('status').textContent='I could not hear that. Tap the microphone to try again.'};rec.onend=()=>{listening=false;el('mic').classList.remove('on');if(heard.trim())check(heard)};try{rec.start()}catch{fallback()}}
function fallback(){el('mic').textContent='✓';el('mic').onclick=selfCheck}
function restoreMic(){el('mic').textContent='🎙️';el('mic').onclick=listen}
function selfCheck(){const ok=confirm('Did you say this line exactly?\n\n'+turns[i][1]);result(ok?100:60,ok?'Perfect! Keep going.':'Good practice. This line will stay on the practice list.')}
function norm(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}function ws(s){return norm(s).split(' ').filter(Boolean)}
function compare(a,b){a=ws(a);b=ws(b);const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let x=0;x<=m;x++)d[x][0]=x;for(let y=0;y<=n;y++)d[0][y]=y;for(let x=1;x<=m;x++)for(let y=1;y<=n;y++)d[x][y]=Math.min(d[x-1][y]+1,d[x][y-1]+1,d[x-1][y-1]+(a[x-1]===b[y-1]?0:1));return Math.max(0,Math.round(100*(1-d[m][n]/Math.max(m,n,1))))}
function check(s){const score=compare(turns[i][1],s),ok=score>=(ws(turns[i][1]).length<5?82:78);if(mode==='performance'||ok)return result(score,score>94?'Perfect! Every word correct.':ok?'Great job! That was close enough.':'This one needs more practice.');attempts++;save(i,score,true,hints);el('feedback').classList.remove('hidden');el('feedback').innerHTML='<b class="warn">Nearly! '+score+'%</b><br>Have another go, or ask for a hint.';el('status').textContent='Tap the microphone to try again.'}
function result(score,msg){session.push(score);save(i,score,attempts>0||score<78,hints);el('feedback').classList.remove('hidden');el('feedback').innerHTML='<b class="'+(score>=78?'good':'warn')+'">'+msg+' '+score+'%</b>';i++;restoreMic();setTimeout(next,1000)}
function hint(){if(i>=turns.length)return;hints++;const w=turns[i][1].split(/\s+/);let t=hints===1?'Think about how Oberon responds to this cue.':hints===2?'First word: '+w[0]:hints===3?'Opening words: '+w.slice(0,4).join(' '):'Full line: '+turns[i][1];el('bubble').textContent=t;el('status').textContent='Now have another go';save(i,0,true,hints)}
function replay(){if(!lastCue)return;speak(lastCue,yourTurn)}function skip(){save(i,0,true,hints);session.push(0);i++;next()}
function speak(t,done){if(!('speechSynthesis' in window)){done();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.93;u.onend=done;u.onerror=done;speechSynthesis.speak(u)}function stopAll(){if('speechSynthesis'in window)speechSynthesis.cancel();if(listening)try{rec.abort()}catch{}listening=false}
function data(){try{return JSON.parse(localStorage.getItem('oberonProgress'))||{}}catch{return {}}}function save(n,score,struggle,h){const p=data(),x=p[n]||{tries:0,best:0,hints:0,struggles:0};x.tries++;x.best=Math.max(x.best,score);x.hints+=h||0;if(struggle)x.struggles++;p[n]=x;localStorage.setItem('oberonProgress',JSON.stringify(p))}
function paint(){el('bar').style.width=(100*i/turns.length)+'%'}function finish(){stopAll();const avg=session.length?Math.round(session.reduce((a,b)=>a+b,0)/session.length):0;el('doneText').innerHTML='<p>Overall accuracy: <b>'+avg+'%</b></p><p>'+(avg>=85?'Brilliant work! Take a bow. 🌟':'Every rehearsal makes Oberon stronger. 🎭')+'</p>';el('done').showModal()}
function showProgress(){const p=data(),v=Object.values(p),tries=v.reduce((a,x)=>a+x.tries,0),learned=v.filter(x=>x.best>=78).length,h=v.reduce((a,x)=>a+x.hints,0),avg=v.length?Math.round(v.reduce((a,x)=>a+x.best,0)/v.length):0;el('stats').innerHTML='<div class="stat"><b>'+learned+'</b>Lines learned</div><div class="stat"><b>'+h+'</b>Hints used</div><div class="stat"><b>'+avg+'%</b>Best accuracy</div><div class="stat"><b>'+tries+'</b>Practice turns</div>';const hard=Object.entries(p).filter(([n,x])=>x.struggles||x.best<78).sort((a,b)=>b[1].struggles-a[1].struggles);el('hard').innerHTML=hard.length?hard.map(([n,x])=>'<div class="line"><b>Oberon:</b> '+escape(turns[n][1])+' <small>Best '+x.best+'%</small></div>').join(''):'<p>No difficult lines yet. Great work!</p>';show('progress')}
function startDifficult(){const p=data();let inds=Object.entries(p).filter(([n,x])=>x.struggles||x.best<78).map(([n])=>+n);if(!inds.length)inds=turns.map((_,n)=>n).slice(0,5);begin('learning',inds)}function resetProgress(){if(confirm('Reset all Oberon practice progress?')){localStorage.removeItem('oberonProgress');showProgress()}}
function showScript(){el('allLines').innerHTML=turns.map((x,n)=>'<div class="line"><small>Cue: '+escape(x[0])+'</small><br><b>'+(n+1)+'. OBERON:</b> '+escape(x[1])+'</div>').join('');show('script')}function escape(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
</script></body></html>
